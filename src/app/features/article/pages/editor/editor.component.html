<div class="editor-page">
  <div class="container page">
    <div class="row">
      <div class="col-md-10 offset-md-1 col-xs-12">
        <app-list-errors [errors]="errors" />

        <form [formGroup]="articleForm">
          <fieldset [disabled]="isSubmitting">
            <fieldset class="form-group">
              <input
                class="form-control form-control-lg"
                formControlName="title"
                type="text"
                placeholder="Article Title"
              />
            </fieldset>

            <fieldset class="form-group">
              <mat-form-field
                appearance="outline"
                class="w-100 datepicker-field"
              >
                <mat-label>Fecha de publicación</mat-label>
                <input
                  matInput
                  [matDatepicker]="publishDatePicker"
                  formControlName="publishDate"
                  placeholder="DD/MM/YYYY"
                  readonly
                />
                <mat-datepicker-toggle
                  matIconSuffix
                  [for]="publishDatePicker"
                ></mat-datepicker-toggle>
                <mat-datepicker #publishDatePicker></mat-datepicker>
              </mat-form-field>
            </fieldset>

            <fieldset class="form-group">
              <input
                class="form-control"
                formControlName="description"
                type="text"
                placeholder="What's this article about?"
              />
            </fieldset>

            <fieldset class="form-group">
              <textarea
                class="form-control"
                formControlName="body"
                rows="8"
                placeholder="Write your article (in markdown)"
              >
              </textarea>
            </fieldset>

            <fieldset class="form-group">
              <input
                class="form-control"
                type="text"
                placeholder="URL de la imagen de portada"
                formControlName="image"
              />
            </fieldset>

            <fieldset class="form-group">
              <label class="text-muted">
                <small>O busca una imagen en Unsplash:</small>
              </label>

              <div class="input-group">
                <input
                  #searchBox
                  type="text"
                  class="form-control"
                  placeholder="Ej: tecnología, PHP, Angular..."
                  (keydown.enter)="
                    $event.preventDefault(); searchForImage(searchBox.value)
                  "
                />
                <button
                  class="btn btn-outline-primary"
                  type="button"
                  [disabled]="isSearchingImages || !searchBox.value.trim()"
                  (click)="searchForImage(searchBox.value)"
                >
                  <i class="ion-search"></i> Buscar
                </button>
              </div>

              @if (imageSearchError) {
                <small class="text-danger d-block mt-1">
                  {{ imageSearchError }}
                </small>
              }

              @if (isSearchingImages) {
                <div class="text-center mt-2">
                  <div class="spinner-border spinner-border-sm" role="status">
                    <span class="visually-hidden">Buscando...</span>
                  </div>
                </div>
              }

              @if (imageSearchResults.length > 0) {
                <div class="image-results-grid mt-3">
                  @for (img of imageSearchResults; track img.id) {
                    <figure class="image-result">
                      <button
                        type="button"
                        class="image-result-button"
                        (click)="selectImage(img)"
                        [attr.aria-label]="
                          'Seleccionar foto de ' + img.user_name
                        "
                      >
                        <img
                          [src]="img.url_small"
                          [alt]="img.alt"
                          class="img-thumbnail"
                        />
                      </button>
                      <figcaption>
                        Foto por
                        <a
                          [href]="img.user_url"
                          target="_blank"
                          rel="noopener noreferrer"
                          >{{ img.user_name }}</a
                        >
                        en
                        <a
                          [href]="img.photo_url"
                          target="_blank"
                          rel="noopener noreferrer"
                          >Unsplash</a
                        >
                      </figcaption>
                    </figure>
                  }
                </div>
              }
            </fieldset>
            <fieldset class="form-group">
              <input
                class="form-control"
                type="text"
                placeholder="Enter tags"
                [formControl]="tagField"
                (keyup.enter)="addTag()"
              />
              <div class="tag-list">
                @for (tag of tagList; track tag) {
                  <span class="tag-default tag-pill">
                    <i class="ion-close-round" (click)="removeTag(tag)"></i>
                    {{ tag }}
                  </span>
                }
              </div>
            </fieldset>

            <button
              class="btn btn-lg pull-xs-right btn-primary"
              type="button"
              (click)="submitForm()"
              [disabled]="articleForm.invalid"
            >
              Publish Article
            </button>
          </fieldset>
        </form>
      </div>
    </div>
  </div>
</div>
